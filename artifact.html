<style>
  :root{
    --bg0:#0b0609; --bg1:#200a12;
    --surface:#180a0f; --surface2:#230e16; --line:#3d1a24;
    --gold:#f5c451; --gold-d:#d9a63a;
    --red:#e5203b; --red-d:#9d1024; --red-deep:#4e0c16;
    --txt:#f7eef1; --muted:#ad8893;
    --blue:#0057b7; --yellow:#ffd700;
    --green:#35d9a0; --violet:#9b8cff; --pink:#ff4d6d;
    --f-ui:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --f-plate:"Arial Black",Impact,system-ui,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{
    background:
      radial-gradient(900px 520px at 50% -10%, rgba(229,32,59,.28) 0, transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(157,16,36,.18) 0, transparent 55%),
      radial-gradient(1200px 800px at 50% 120%, rgba(78,12,22,.35) 0, transparent 60%),
      var(--bg0);
    color:var(--txt); font-family:var(--f-ui); display:flex; justify-content:center;
    align-items:stretch; overflow:hidden;
  }
  .app{
    width:100%; max-width:460px; height:100dvh; display:flex; flex-direction:column;
    background:
      radial-gradient(600px 300px at 50% -6%, rgba(229,32,59,.14) 0, transparent 70%),
      linear-gradient(180deg, #170810 0%, #0c0609 55%, #0b0609 100%);
    position:relative; overflow:hidden;
  }
  .app.shake{animation:shake .6s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{10%,90%{transform:translate(-2px,0)}20%,80%{transform:translate(4px,0)}30%,50%,70%{transform:translate(-7px,0)}40%,60%{transform:translate(7px,0)}}
  @media (min-width:560px){
    body{padding:18px}
    .app{height:min(880px,95vh); border-radius:30px; border:1px solid var(--line);
      box-shadow:0 34px 90px rgba(0,0,0,.7), 0 0 60px rgba(157,16,36,.25), inset 0 1px 0 rgba(255,255,255,.05)}
  }

  /* ===== Top bar ===== */
  .topbar{flex:none; display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:14px 14px 11px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(36,12,19,.92), rgba(20,8,12,.55)); backdrop-filter:blur(8px);
    box-shadow:0 1px 0 rgba(229,32,59,.22), 0 10px 24px rgba(0,0,0,.35)}
  .logo{font-weight:900; font-size:16px; letter-spacing:.2px; display:flex; align-items:center; gap:6px; min-width:0;
    text-shadow:0 1px 10px rgba(229,32,59,.35)}
  .logo .ico{flex:none}
  .logo .name{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .logo .dot{background:linear-gradient(180deg,var(--gold),var(--gold-d)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .chips{display:flex; align-items:center; gap:7px; flex:none}
  @media (max-width:400px){
    .logo .n1{display:none}
    .logo{font-size:15px}
    .chips{gap:6px}
    .chip{padding:6px 8px}
    .iconbtn{padding:6px 7px}
  }
  .chip{display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:6px 10px; line-height:1}
  .chip .v{font-weight:800; font-variant-numeric:tabular-nums}
  .chip.bal .v{color:var(--gold)}
  .chip.free{color:var(--green); border-color:rgba(53,217,160,.4); background:rgba(53,217,160,.1)}
  .iconbtn{background:var(--surface); border:1px solid var(--line); color:var(--txt); border-radius:11px;
    padding:6px 8px; font-size:15px; cursor:pointer; line-height:1}
  .iconbtn:active{transform:translateY(1px)}

  /* ===== Screens ===== */
  .screens{flex:1; overflow-y:auto; overflow-x:hidden; padding:14px 14px 10px; display:flex; flex-direction:column}
  .screen{display:flex; flex-direction:column; gap:13px; animation:fade .25s ease}
  .screen[hidden]{display:none}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
  .scr-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
  .scr-head h2{margin:0; font-size:18px; font-weight:900; letter-spacing:.2px}
  .scr-head .sub{font-size:12px; color:var(--muted)}

  /* ===== Plate ===== */
  .plate-wrap{display:flex; justify-content:center; margin:14px 0 4px; position:relative}
  .plate-wrap::before{content:""; position:absolute; width:260px; height:140px; left:50%; top:50%;
    transform:translate(-50%,-50%); border-radius:50%; pointer-events:none;
    background:radial-gradient(closest-side, rgba(229,32,59,.35), transparent 72%); filter:blur(6px)}
  .plate{--h:94px; height:var(--h); width:min(100%,380px); background:linear-gradient(180deg,#fcfcfa,#eceae4); border-radius:12px;
    border:3px solid #0c0c0c; display:flex; align-items:stretch; overflow:hidden; position:relative; z-index:1;
    box-shadow:0 18px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.35), 0 0 34px rgba(229,32,59,.18),
      inset 0 2px 0 rgba(255,255,255,.85), inset 0 -10px 20px rgba(0,0,0,.1); transition:box-shadow .4s}
  .plate::after{content:""; position:absolute; inset:0; pointer-events:none; z-index:3;
    background:linear-gradient(105deg, transparent 32%, rgba(255,255,255,.55) 47%, rgba(255,255,255,.1) 54%, transparent 64%);
    transform:translateX(-120%)}
  .plate.win::after{animation:sheen .8s ease}
  @keyframes sheen{to{transform:translateX(120%)}}
  .plate .eu{width:clamp(42px,12.5vw,52px); flex:none; background:var(--blue); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; color:#fff}
  .plate .eu .fl{width:25px; height:16px; border-radius:2px; overflow:hidden; box-shadow:0 0 0 1px rgba(255,255,255,.25)}
  .plate .eu .fl .b{height:50%; background:var(--blue)} .plate .eu .fl .y{height:50%; background:var(--yellow)}
  .plate .eu .ua{font-weight:800; font-size:13px; letter-spacing:1px}
  .plate .chars{flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:clamp(3px,1.1vw,5px); padding:0 clamp(4px,1.6vw,8px)}
  .cell{font-family:var(--f-plate); font-weight:900; font-size:clamp(30px,10vw,40px); color:#141414; min-width:clamp(20px,6.5vw,29px); text-align:center; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 1px 0 rgba(255,255,255,.55), 0 -1px 1px rgba(0,0,0,.12); position:relative; z-index:2}
  .cell.sp{min-width:clamp(6px,2.1vw,11px)} .cell.spinning{color:#5a5a5a; filter:blur(.5px)}
  .plate.win{animation:pop .45s ease}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}

  /* ===== Verdict ===== */
  .verdict{background:linear-gradient(180deg,var(--surface2),var(--surface)); border:1px solid var(--line); border-radius:16px; padding:16px 14px;
    text-align:center; min-height:138px; display:flex; flex-direction:column; gap:9px; justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04), inset 0 0 40px rgba(229,32,59,.06), 0 10px 28px rgba(0,0,0,.35)}
  .rank{display:inline-flex; align-items:center; gap:8px; align-self:center; padding:6px 15px; border-radius:999px;
    font-weight:800; font-size:15px; opacity:0; transform:translateY(6px); transition:.3s}
  .rank.show{opacity:1; transform:none}
  .rank.jackpot{animation:glow 1s ease-in-out infinite alternate}
  @keyframes glow{from{box-shadow:0 0 6px rgba(255,77,109,.45)}to{box-shadow:0 0 24px rgba(255,77,109,.9)}}
  .price{font-size:34px; font-weight:900; color:var(--gold); font-variant-numeric:tabular-nums; letter-spacing:.5px; text-shadow:0 2px 16px rgba(245,196,81,.3)}
  .price small{font-size:17px; color:var(--muted); font-weight:700}
  .evalLabel{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px}
  .reasons{display:flex; flex-wrap:wrap; gap:6px; justify-content:center}
  .tag{font-size:12px; background:var(--surface2); border:1px solid var(--line); color:#efd8de; padding:4px 9px; border-radius:999px}
  .hint{color:var(--muted); font-size:13px; line-height:1.45}

  /* ===== Buttons ===== */
  .btn{font-family:inherit; border:1px solid transparent; border-radius:14px; padding:14px 12px; font-weight:800;
    font-size:15px; cursor:pointer; color:#13121f; transition:transform .05s, filter .15s; width:100%}
  .btn:active{transform:translateY(1px)} .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn:hover:not(:disabled){filter:brightness(1.07)}
  .btn:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
  .btn.red{background:linear-gradient(180deg,#f23b52,var(--red-d)); color:#fff; border-color:rgba(255,130,150,.3);
    box-shadow:0 10px 26px rgba(229,32,59,.42), inset 0 1px 0 rgba(255,255,255,.28)}
  .btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold-d)); box-shadow:0 10px 24px rgba(245,196,81,.3), inset 0 1px 0 rgba(255,255,255,.4)}
  .btn.green{background:linear-gradient(180deg,#53e0a6,#27b681); color:#06281c; box-shadow:0 10px 22px rgba(53,217,160,.26), inset 0 1px 0 rgba(255,255,255,.3)}
  .btn.blue{background:linear-gradient(180deg,#3a1a24,#241019); color:var(--gold); border-color:var(--line); box-shadow:0 8px 20px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06)}
  .btn.ghost{background:var(--surface2); color:var(--txt); border-color:var(--line)}
  .spin-row{margin-top:2px}
  .btn-spin{font-size:19px; padding:16px}
  .btn-spin .cost{display:block; font-size:12px; opacity:.85; font-weight:700; margin-top:2px}
  .deal{display:flex; gap:10px}

  /* ===== Cards / lists ===== */
  .card{background:linear-gradient(180deg,var(--surface2),var(--surface)); border:1px solid var(--line); border-radius:16px; padding:14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03), 0 8px 22px rgba(0,0,0,.28)}
  .card h3{margin:0 0 4px; font-size:15px; font-weight:800}
  .card p.muted{margin:0; color:var(--muted); font-size:12.5px; line-height:1.45}
  .list{display:flex; flex-direction:column; gap:7px}
  .row{display:flex; align-items:center; gap:10px; background:linear-gradient(180deg,var(--surface2),var(--surface)); border:1px solid var(--line);
    border-radius:12px; padding:9px 11px; box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .row .plate-mini{font-weight:900; letter-spacing:.5px; white-space:nowrap; font-size:14px}
  .row .meta{flex:1; min-width:0}
  .row .meta .rk{font-size:11px; color:var(--muted)}
  .row .pr{color:var(--gold); font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap}
  .row .btn{width:auto; padding:8px 12px; font-size:13px}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:22px 8px}
  .total{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .total .lbl{color:var(--muted); font-size:13px} .total .amt{color:var(--gold); font-weight:900; font-size:18px; font-variant-numeric:tabular-nums}

  /* ===== Tabs (leaders) ===== */
  .tabs{display:flex; gap:7px; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:4px}
  .tabs button{flex:1; border:0; background:transparent; color:var(--muted); font-weight:800; font-size:13px;
    padding:9px; border-radius:10px; cursor:pointer; font-family:inherit}
  .tabs button.on{background:linear-gradient(180deg,#3a1420,#2a0f17); color:var(--gold); box-shadow:inset 0 0 0 1px rgba(245,196,81,.28), 0 4px 12px rgba(0,0,0,.35)}
  .lb-row{display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:12px; border:1px solid transparent}
  .lb-row:nth-child(odd){background:rgba(255,255,255,.015)}
  .lb-row.me{background:rgba(245,196,81,.12); border-color:rgba(245,196,81,.45)}
  .lb-row .num{width:30px; text-align:center; font-weight:900; color:var(--muted); font-variant-numeric:tabular-nums}
  .lb-row.me .num{color:var(--gold)}
  .lb-row .nm{flex:1; min-width:0; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .lb-row .val{font-weight:800; font-variant-numeric:tabular-nums; color:var(--gold)}
  .lb-row.spins .val{color:var(--violet)}
  .lb-sep{height:1px; background:var(--line); margin:4px 0}
  .medal{font-size:15px}

  /* ===== Shop ===== */
  .pack{display:flex; align-items:center; gap:12px}
  .pack .ic{font-size:26px} .pack .info{flex:1} .pack .info .amt{font-weight:900; color:var(--gold); font-size:16px}
  .pack .info .tag{display:inline-block; margin-top:3px; font-size:10px; font-weight:800; color:#06281c;
    background:var(--green); padding:2px 7px; border-radius:999px; letter-spacing:.3px}
  .pack .info .tag.best{background:var(--gold)}
  .pack .btn{width:auto; padding:10px 14px; white-space:nowrap}

  /* ===== Bottom nav ===== */
  .bottomnav{flex:none; display:flex; border-top:1px solid var(--line); background:rgba(14,6,9,.97);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom)); backdrop-filter:blur(10px);
    box-shadow:0 -1px 0 rgba(229,32,59,.18), 0 -10px 24px rgba(0,0,0,.4)}
  .navbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:transparent;
    border:0; color:var(--muted); font-family:inherit; font-size:10.5px; font-weight:700; cursor:pointer; padding:7px 2px; border-radius:12px; position:relative}
  .navbtn .ic{font-size:21px; line-height:1; filter:grayscale(.4) opacity(.8)}
  .navbtn.on{color:var(--gold)} .navbtn.on .ic{filter:none}
  .navbtn.on::before{content:""; position:absolute; top:0; width:28px; height:3px; border-radius:3px;
    background:linear-gradient(90deg,var(--red),var(--gold)); box-shadow:0 0 10px rgba(245,196,81,.6)}

  /* ===== Overlays ===== */
  #flash{position:fixed; inset:0; pointer-events:none; z-index:55; opacity:0;
    background:radial-gradient(circle at 50% 40%, rgba(245,196,81,.55), rgba(229,32,59,.3) 42%, transparent 70%); transition:opacity .5s}
  #fx{position:fixed; inset:0; pointer-events:none; z-index:60}
  .toast{position:fixed; left:50%; bottom:92px; transform:translateX(-50%) translateY(10px); z-index:65;
    background:#1c0a11; border:1px solid var(--line); color:var(--txt); padding:11px 16px; border-radius:12px;
    font-size:13.5px; font-weight:700; box-shadow:0 12px 30px rgba(0,0,0,.5); opacity:0; transition:.25s; max-width:86vw; text-align:center}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .modal-overlay{position:fixed; inset:0; z-index:70; background:rgba(6,2,4,.8); display:flex; align-items:center;
    justify-content:center; padding:24px; backdrop-filter:blur(3px)}
  .modal-overlay[hidden]{display:none}
  .modal-card{background:linear-gradient(180deg,var(--surface2),var(--surface)); border:1px solid var(--line); border-radius:18px; padding:20px; max-width:340px; width:100%; text-align:center;
    box-shadow:0 30px 70px rgba(0,0,0,.6), 0 0 40px rgba(157,16,36,.2), inset 0 1px 0 rgba(255,255,255,.05)}
  .modal-card h3{margin:0 0 8px; font-size:17px} .modal-card p{margin:0 0 16px; color:var(--muted); font-size:14px; line-height:1.5}
  .modal-actions{display:flex; gap:10px} .modal-actions .btn{flex:1}
  .adbar{height:8px; border-radius:6px; background:var(--surface2); overflow:hidden; margin-top:14px}
  .adbar > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--green),var(--gold)); transition:width .1s linear}

  /* ===== Region line ===== */
  .region{font-size:12.5px; color:var(--muted); margin-top:-2px}

  /* ===== Profile ===== */
  #profileBody{display:flex; flex-direction:column; gap:13px}
  .prof-head{display:flex; gap:14px; align-items:center; padding:16px; border-radius:16px; border:1px solid var(--line); box-shadow:inset 0 0 40px rgba(0,0,0,.25)}
  .avatar{width:66px; height:66px; border-radius:18px; border:2px solid rgba(245,196,81,.45); background:rgba(0,0,0,.35); font-size:36px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none; box-shadow:0 6px 16px rgba(0,0,0,.4), inset 0 0 18px rgba(0,0,0,.4)}
  .pinfo{flex:1; min-width:0}
  .pnick{font-weight:900; font-size:19px; display:flex; align-items:center; gap:6px}
  .editbtn{background:transparent; border:0; cursor:pointer; font-size:14px; opacity:.85}
  .plvl{color:var(--gold); font-weight:800; font-size:13px; margin:3px 0 5px}
  .xpbar{height:8px; border-radius:6px; background:rgba(0,0,0,.4); overflow:hidden}
  .xpbar>i{display:block; height:100%; background:linear-gradient(90deg,var(--red),var(--gold)); box-shadow:0 0 10px rgba(245,196,81,.5)}
  .xptxt{font-size:11px; color:var(--muted); margin-top:3px; font-variant-numeric:tabular-nums}
  .daily{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .daily h3{margin:0; font-size:15px} .daily .btn{width:auto; padding:11px 16px}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .stat{background:linear-gradient(180deg,var(--surface2),var(--surface)); border:1px solid var(--line); border-radius:12px; padding:10px 8px; text-align:center; box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
  .stat .sv{font-weight:900; font-size:14px; color:var(--gold); font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .stat .sl{font-size:10px; color:var(--muted); margin-top:2px}
  .achs{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
  .ach{display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:9px 11px; opacity:.4; filter:grayscale(1)}
  .ach.on{opacity:1; filter:none; border-color:rgba(245,196,81,.5); background:linear-gradient(180deg,#2c1119,#1d0b11); box-shadow:0 4px 14px rgba(0,0,0,.3), inset 0 0 18px rgba(245,196,81,.05)}
  .ach .ai{font-size:22px; flex:none} .ach .an{font-size:12px; font-weight:700; line-height:1.15}
  .owned{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
  .oitem{display:flex; align-items:center; gap:9px; background:linear-gradient(180deg,var(--surface2),var(--surface)); border:1px solid var(--line); border-radius:12px; padding:8px; box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .oitem .oname{font-size:12.5px; font-weight:700; line-height:1.2; min-width:0; overflow:hidden; text-overflow:ellipsis}

  /* ===== Assets / shop extras ===== */
  .subprice{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
  .ownedtag{color:var(--green); font-weight:800; font-size:13px; white-space:nowrap}
  /* SVG asset illustrations (houses / cars / backgrounds) */
  .asset-thumb{width:72px; height:54px; border-radius:11px; overflow:hidden; flex:none; position:relative;
    background:radial-gradient(120% 120% at 50% 0%, #241017, #0e0609); border:1px solid var(--line);
    box-shadow:inset 0 0 16px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05)}
  .asset-thumb svg{display:block; width:100%; height:100%}
  .asset-thumb .scene{position:absolute; inset:0; width:100%; height:100%}
  .oitem .asset-thumb{width:50px; height:38px; border-radius:9px}
  .asset-card{display:flex; align-items:center; gap:12px; background:linear-gradient(180deg,var(--surface2),var(--surface));
    border:1px solid var(--line); border-radius:14px; padding:10px; box-shadow:0 6px 16px rgba(0,0,0,.3)}
  .asset-info{flex:1; min-width:0}
  .asset-name{font-weight:800; font-size:14px; line-height:1.2}
  .asset-price{font-size:12.5px; color:var(--gold); font-variant-numeric:tabular-nums; margin-top:3px; font-weight:800}
  .asset-card .btn{width:auto; padding:10px 14px; white-space:nowrap; font-size:13px}
  .asset-card .ownedtag{margin-right:4px}
  .avgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:8px 0 14px}
  .avopt{font-size:28px; background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:8px; cursor:pointer}
  .avopt.on{border-color:var(--gold); background:rgba(245,196,81,.15)}
  .nickinput{width:100%; background:var(--surface2); border:1px solid var(--line); border-radius:12px; color:var(--txt); font-family:inherit; font-size:16px; padding:12px; margin:4px 0 16px; text-align:center}
  .nickinput:focus{outline:2px solid var(--gold)}

  @media (prefers-reduced-motion: reduce){.app.shake{animation:none}.rank.jackpot{animation:none}}
</style>

<div class="app" id="app">
  <!-- Top bar -->
  <header class="topbar">
    <div class="logo"><span class="ico">🎰</span><span class="name"><span class="n1">Номерний&nbsp;</span><span class="dot">Слот</span></span></div>
    <div class="chips">
      <div class="chip free" id="freeChip" hidden>🎟 <span class="v" id="freeVal">0</span></div>
      <div class="chip bal">₴ <span class="v" id="balance">1000</span></div>
      <button class="iconbtn" id="langBtn" onclick="cycleLang()" aria-label="Language">🇺🇦</button>
      <button class="iconbtn" id="muteBtn" onclick="toggleMute()" aria-label="Sound">🔊</button>
    </div>
  </header>

  <!-- Screens -->
  <main class="screens" id="screens">

    <!-- GAME -->

  let df=1, dr=null; const put=(f,k,x)=>{ if(f>df){df=f; dr={k,x};} };
  if(allSame){ if(s==='7777') put(2600,'quad7'); else put(1900,'quad',s); }
  if(val>=1&&val<=10)            put(1250,'legendary',val);
  if(isSeqUp(s)||isSeqDown(s))   put(620,'sequence',s);
  if(hasTriple(s)&&!allSame)     put(270,'triple');
  if(/777/.test(s)&&!allSame)    put(330,'triple7');
  if(isPalindrome(s)&&!allSame)  put(120,'palindrome',s);
  if(isAABB(s))                  put(95,'aabb',s);
  if(isABAB(s))                  put(95,'abab',s);
  if(/000$/.test(s)&&!allSame)   put(78,'round',s);
  if(val>=11&&val<=100)          put(44,'low');
  if(!dr&&/(\d)\1/.test(s))      put(6,'pairDigits');
  const regPair=region[0]===region[1], serPair=series[0]===series[1];
  let lf=1, lr=null;
  if(regPair&&serPair&&region[0]===series[0]){lf=56; lr={k:'allLetters'};}
  else if(regPair&&serPair){lf=9; lr={k:'doubleLetters'};}
  else if(region===series){lf=8; lr={k:'regionSeries'};}
  else if(regPair||serPair){lf=3; lr={k:'pairLetters'};}
  let price=Math.round(50*df*lf*(0.94+Math.random()*0.12)*regionFactor(region));
  price=Math.max(50,Math.min(price,MAX_PRICE)); price=roundNice(price);
  const reasons=[dr,lr].filter(Boolean); if(!reasons.length) reasons.push({k:'nothing'});
  let tier; if(price>=1000000)tier=4; else if(price>=100000)tier=3; else if(price>=10000)tier=2; else if(price>=1000)tier=1; else tier=0;
  return {price,tier,reasons};
}
function roundNice(p){ if(p>=1e6)return Math.round(p/5e4)*5e4; if(p>=1e5)return Math.round(p/5e3)*5e3;
  if(p>=1e4)return Math.round(p/500)*500; if(p>=1e3)return Math.round(p/50)*50; return Math.round(p/10)*10; }
function isSeqUp(s){for(let i=1;i<s.length;i++)if(+s[i]!==+s[i-1]+1)return false;return true;}
function isSeqDown(s){for(let i=1;i<s.length;i++)if(+s[i]!==+s[i-1]-1)return false;return true;}
function isPalindrome(s){return s===s.split('').reverse().join('');}
function isAABB(s){return s[0]===s[1]&&s[2]===s[3]&&s[0]!==s[2];}
function isABAB(s){return s[0]===s[2]&&s[1]===s[3]&&s[0]!==s[1];}
function hasTriple(s){return /(.)\1\1/.test(s);}
function reasonText(r){return r.special?(r.special[LANG]||r.special.uk):t('reasons.'+r.k, r.x!=null?{x:r.x}:null);}

function tone(freq,dur,type='sine',gain=0.15,when=0){ if(muted||!actx)return;
  const t0=actx.currentTime+when, o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t0); g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(gain,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+dur+0.02); }

const fx=document.getElementById('fx'), fxc=fx.getContext('2d'); let parts=[], raf=null;
function sizeFx(){ fx.width=innerWidth; fx.height=innerHeight; } addEventListener('resize',sizeFx); sizeFx();
function confetti(n,pow){ const cols=['#f5c451','#e5203b','#ffd700','#ff4d6d','#fff','#9d1024'];
  const cx=innerWidth/2, cy=innerHeight*0.36;
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=(2+Math.random()*6)*pow;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6*pow,g:0.18+Math.random()*0.12,
     s:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[(Math.random()*cols.length)|0],life:1}); }
  if(!raf) raf=requestAnimationFrame(stepFx); }
function stepFx(){ fxc.clearRect(0,0,fx.width,fx.height); parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=0.008;
    fxc.save(); fxc.globalAlpha=Math.max(0,p.life); fxc.translate(p.x,p.y); fxc.rotate(p.r);
    fxc.fillStyle=p.c; fxc.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); fxc.restore(); });
  if(parts.length) raf=requestAnimationFrame(stepFx); else{ fxc.clearRect(0,0,fx.width,fx.height); raf=null; } }

function spin(){
  if(spinning) return; ensureAudio();
  if(current){ const p=current.price; balance+=p; trackEarn(p); addXp(1); current=null; document.getElementById('dealActions').style.display='none'; save('balance',balance); updateTopbar(); showToast(t('autosold',{x:fmt(p)})); }
  if(freeSpins>0){ freeSpins--; save('free',freeSpins); }
  else if(balance>=SPIN_COST){ balance-=SPIN_COST; }
  else { showToast(t('noFunds')); switchScreen('shop'); return; }
  totalSpins++; save('spins',totalSpins); save('balance',balance); updateTopbar(); updateSpinBtn();
  spinning=true;
  document.getElementById('spinBtn').disabled=true;
  const plate=document.getElementById('plate'); plate.classList.remove('win'); plate.style.boxShadow='';
  document.getElementById('verdict').innerHTML='<div class="evalLabel">'+t('evalLabel')+'</div><div class="price" id="priceValue">0 <small>₴</small></div>';
  let region,digits,series;
  if(FORCE){ ({region,digits,series}=FORCE); FORCE=null; }
  else if(RIG){ ({region,digits,series}=rigPlate()); }
  else { region=pickRegion(); digits=''+rD()+rD()+rD()+rD(); series=rL()+rL(); }
  const final=(region+digits+series).split('');
  const cells=[...document.querySelectorAll('.cell[data-i]')];
  cells.forEach(c=>c.classList.add('spinning'));
  const lockAt=[240,380,540,680,820,960,1140,1280], start=performance.now();
  const tick=now=>{ const tt=now-start;
    cells.forEach((c,i)=>{ if(c.classList.contains('spinning')){
      if(tt>=lockAt[i]){ c.textContent=final[i]; c.classList.remove('spinning'); sndLock(); }
      else c.textContent=(i<2||i>5)?rL():rD(); } });
    if(cells.some(c=>c.classList.contains('spinning'))) requestAnimationFrame(tick);
    else finishSpin(region,digits,series); };
  requestAnimationFrame(tick);
}
function finishSpin(region,digits,series){
  const res=evaluate(region,digits,series);
  current={region,digits,series,plate:region+' '+digits+' '+series,...res};
  if(res.price>bestPrice){ bestPrice=res.price; save('best',bestPrice); }
  if(res.tier===4){ jackpotCount++; save('jackpots',jackpotCount); }
  if(res.special){ seenSpecials[res.special]=true; save('seen',seenSpecials); }
  addXp(15+Math.floor(res.price/20000)); checkAch();
  const plate=document.getElementById('plate'); plate.classList.add('win');
  if(res.tier>=2) plate.style.boxShadow='0 14px 32px rgba(0,0,0,.5), 0 0 26px '+RANK[res.tier].c;
  countUp(res.price,res.tier,()=>{ spinning=false; document.getElementById('dealActions').style.display='flex';
    document.getElementById('sellBtn').textContent=t('sell'); document.getElementById('keepBtn').textContent=t('keep');
    updateSpinBtn(); });
}
function countUp(target,tier,done){
  const el=document.getElementById('priceValue');
  const dur=target<500?550:Math.min(3800,700+Math.log10(target)*560);
  const start=performance.now(); let lastBlip=0;
  const step=now=>{ const p=Math.min(1,(now-start)/dur), e=1-Math.pow(1-p,3), cur=Math.round(target*e);
    if(el) el.innerHTML=fmt(cur)+' <small>₴</small>';
    if(now-lastBlip>70&&p<1){ sndBlip(p); lastBlip=now; }
    if(p<1) requestAnimationFrame(step);
    else{ if(el) el.innerHTML=fmt(target)+' <small>₴</small>'; celebrate(tier); done&&done(); } };
  requestAnimationFrame(step);
}

}

];
function levelInfo(x){ let lvl=1, need=300, acc=0; while(x>=acc+need){ acc+=need; lvl++; need=300+(lvl-1)*200; }
  return {level:lvl, cur:x-acc, need, pct:Math.min(100,Math.round((x-acc)/need*100))}; }
function addXp(n){ const b=levelInfo(xp).level; xp+=n; save('xp',xp); if(levelInfo(xp).level>b) showToast(t('levelUp',{x:levelInfo(xp).level})); }
function trackEarn(n){ totalEarned+=n; save('earned',totalEarned); }
function checkAch(){ let ch=false;
  for(const a of ACH){ if(!achDone[a.id] && a.cond()){ achDone[a.id]=true; ch=true;
    if(a.reward) balance+=a.reward; showToast(t('achGot',{x:a.n[LANG]||a.n.uk})+(a.reward?(' +'+fmt(a.reward)+' ₴'):'')); } }
  if(ch){ save('ach',achDone); save('balance',balance); updateTopbar(); if(activeScreen==='profile') renderProfile(); } }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function canDaily(){ return dailyLast!==todayStr(); }
function claimDaily(){ if(!canDaily()) return; dailyLast=todayStr(); save('daily',dailyLast);
  balance+=300; freeSpins+=2; save('balance',balance); save('free',freeSpins); trackEarn(300); addXp(50);
  updateTopbar(); updateSpinBtn(); renderProfile(); showToast(t('profile.dailyGot',{x:fmt(300)})); checkAch(); }
function buyAsset(id){ const a=ASSETS.find(x=>x.id===id); if(!a||owned[a.id]) return;
  if(balance<a.price){ showToast(t('shop.need',{x:fmt(a.price-balance)})); return; }
  showConfirm(t('shop.buy')+': '+(a.n[LANG]||a.n.uk)+' — '+fmt(a.price)+' ₴?',()=>{
    balance-=a.price; owned[a.id]=true; save('balance',balance); save('owned',owned);
    if(a.cat==='bg') { equippedBg=a.id; save('bg',equippedBg); }
    addXp(100); updateTopbar(); renderShop(); showToast(t('shop.bought',{x:a.n[LANG]||a.n.uk})); checkAch(); }); }
function equipBg(id){ equippedBg=id; save('bg',equippedBg); renderShop(); if(activeScreen==='profile') renderProfile();
  const a=ASSETS.find(x=>x.id===id); showToast(t('shop.equippedMsg',{x:a?(a.n[LANG]||a.n.uk):''})); }
function setAvatar(e){ avatar=e; save('avatar',avatar); closeModal(); renderProfile(); }
function pickAvatarModal(){ const m=document.getElementById('modal');
  m.innerHTML='<div class="modal-card"><h3>'+t('profile.avatarPick')+'</h3><div class="avgrid">'+
    AVATARS.map(e=>'<button class="avopt'+(e===avatar?' on':'')+'" onclick="setAvatar(\''+e+'\')">'+e+'</button>').join('')+
    '</div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">'+t('cancel')+'</button></div></div>'; m.hidden=false; }
function editNick(){ const m=document.getElementById('modal');
  m.innerHTML='<div class="modal-card"><h3>'+t('profile.editNick')+'</h3><input id="nickIn" class="nickinput" maxlength="16" placeholder="'+t('profile.nickPh')+'" value="'+(nick||'')+'"><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">'+t('cancel')+'</button><button class="btn gold" onclick="saveNick()">'+t('profile.save')+'</button></div></div>'; m.hidden=false;
  setTimeout(()=>{ const i=document.getElementById('nickIn'); if(i) i.focus(); },60); }
function saveNick(){ const i=document.getElementById('nickIn'); if(i){ nick=(i.value||'').trim().slice(0,16); save('nick',nick); } closeModal(); renderProfile(); }
function renderProfile(){
  const li=levelInfo(xp), rank=leaderRows('money').rank, bgObj=equippedBg&&ASSETS.find(a=>a.id===equippedBg);
  const headBg=bgObj?bgObj.bg:'linear-gradient(135deg,#2c1019,#140810)', nm=nick||t('you');
  const stat=(l,v)=>'<div class="stat"><div class="sv">'+v+'</div><div class="sl">'+l+'</div></div>';

  document.getElementById('profileBody').innerHTML=
   '<div class="prof-head" style="background:'+headBg+'"><button class="avatar" onclick="pickAvatarModal()">'+avatar+'</button>'+
    '<div class="pinfo"><div class="pnick">'+nm+' <button class="editbtn" onclick="editNick()">✏️</button></div>'+
     '<div class="plvl">'+t('profile.level',{x:li.level})+'</div><div class="xpbar"><i style="width:'+li.pct+'%"></i></div>'+

   '<div class="card"><div class="daily"><div><h3>'+t('profile.dailyTitle')+'</h3>'+
     (canDaily()?'':'<p class="muted" style="margin:3px 0 0">'+t('profile.dailyWait')+'</p>')+'</div>'+
     '<button class="btn gold" onclick="claimDaily()"'+(canDaily()?'':' disabled')+'>'+t('profile.dailyClaim')+'</button></div></div>'+
   '<div class="stats">'+stat(t('profile.stSpins'),fmt(totalSpins))+stat(t('profile.stEarned'),fmt(totalEarned)+' ₴')+
     stat(t('profile.stBest'),fmt(bestPrice)+' ₴')+stat(t('profile.stCol'),collection.length)+
     stat(t('profile.stRank'),'#'+rank)+stat(t('profile.stAch'),achN+'/'+ACH.length)+'</div>'+
   '<div class="scr-head"><h2>'+t('profile.achTitle')+'</h2></div><div class="achs">'+
     ACH.map(a=>'<div class="ach'+(achDone[a.id]?' on':'')+'"><div class="ai">'+a.ic+'</div><div class="an">'+(a.n[LANG]||a.n.uk)+'</div></div>').join('')+'</div>'+
   '<div class="scr-head"><h2>'+t('profile.owned')+'</h2></div>'+
   (ownedList.length?'<div class="owned">'+ownedList.map(a=>'<div class="oitem"><div class="asset-thumb">'+assetThumbInner(a)+'</div><span class="oname">'+(a.n[LANG]||a.n.uk)+'</span></div>').join('')+'</div>':'<div class="empty">'+t('profile.noAssets')+'</div>');
}
function setShopTab(tab){ shopTab=tab; renderShop(); }
function renderAssets(){
  const cats=[['houses','shop.catHouses'],['cars','shop.catCars'],['bg','shop.catBg']];
  return cats.map(c=>{ const cat=c[0];
    return '<div class="scr-head" style="margin-top:4px"><h2 style="font-size:15px">'+t(c[1])+'</h2></div><div class="list">'+
    ASSETS.filter(a=>a.cat===cat).map(a=>{ const own=owned[a.id], isBg=a.cat==='bg', eq=isBg&&equippedBg===a.id; let btn;
      if(!own) btn='<button class="btn gold" onclick="buyAsset(\''+a.id+'\')">'+t('shop.buy')+'</button>';
      else if(isBg) btn='<button class="btn '+(eq?'ghost':'blue')+'"'+(eq?' disabled':'')+' onclick="equipBg(\''+a.id+'\')">'+t(eq?'shop.equipped':'shop.equip')+'</button>';
      else btn='<span class="ownedtag">'+t('shop.owned')+'</span>';
      return '<div class="asset-card"><div class="asset-thumb">'+assetThumbInner(a)+'</div><div class="asset-info"><div class="asset-name">'+(a.n[LANG]||a.n.uk)+'</div><div class="asset-price">'+fmt(a.price)+' ₴</div></div>'+btn+'</div>';
    }).join('')+'</div>'; }).join('');
}

/* ======================= Рендер ======================= */
function fmt(n){ return Number(n).toLocaleString(LOCALE[LANG]); }
function updateTopbar(){
  document.getElementById('balance').textContent=fmt(balance);
  const fc=document.getElementById('freeChip');
  if(freeSpins>0){ fc.hidden=false; document.getElementById('freeVal').textContent=freeSpins; } else fc.hidden=true;
  document.getElementById('langBtn').textContent=LANG_FLAG[LANG];
  document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';
}
function updateSpinBtn(){ const b=document.getElementById('spinBtn'); if(!b)return;
  const sub=freeSpins>0?(t('free')+' ('+freeSpins+')'):('−'+SPIN_COST+' ₴');
  b.innerHTML=t('spin')+'<span class="cost">'+sub+'</span>'; b.disabled=spinning; }
function setVerdictHint(){ document.getElementById('verdict').innerHTML='<div class="hint">'+t('hintStart')+'</div>'; }
function renderGameVerdict(){ if(spinning) return; if(current) document.getElementById('verdict').innerHTML=verdictResultHTML(false); else setVerdictHint(); }
function renderNav(){
  const items=[['game','🎰'],['collection','🗂'],['leaders','🏆'],['shop','🛒'],['profile','👤']];
  document.getElementById('nav').innerHTML=items.map(([k,ic])=>
    '<button class="navbtn'+(activeScreen===k?' on':'')+'" onclick="switchScreen(\''+k+'\')"><span class="ic">'+ic+'</span>'+t('nav.'+k)+'</button>').join('');
}
function switchScreen(name){ activeScreen=name;
  document.querySelectorAll('.screen').forEach(s=>s.hidden = s.dataset.screen!==name);
  renderNav(); renderScreen(name);
}
function renderScreen(name){
  if(name==='game'){ updateSpinBtn(); renderGameVerdict();
    document.getElementById('sellBtn').textContent=t('sell'); document.getElementById('keepBtn').textContent=t('keep'); }
  else if(name==='collection') renderCollection();
  else if(name==='leaders') renderLeaders();
  else if(name==='shop') renderShop();
  else if(name==='profile') renderProfile();
}
function renderCollection(){
  document.getElementById('colTitle').textContent=t('colTitle');
  document.getElementById('colCount').textContent=t('colCount',{x:collection.length});
  document.getElementById('colTotalLbl').textContent=t('colTotal');
  const sum=collection.reduce((a,b)=>a+b.price,0);
  document.getElementById('colTotalAmt').textContent=fmt(sum)+' ₴';
  const sa=document.getElementById('sellAllBtn');
  if(collection.length){ sa.style.display='block'; sa.textContent=t('sellAll',{x:fmt(sum)}); } else sa.style.display='none';
  const list=document.getElementById('colList');
  if(!collection.length){ list.innerHTML='<div class="empty">'+t('colEmpty')+'</div>'; return; }
  list.innerHTML=collection.map((c,i)=>
    '<div class="row"><div class="meta"><div class="plate-mini">'+c.plate+'</div><div class="rk">'+t('ranks.'+(c.tier||0))+'</div></div>'+
    '<div class="pr">'+fmt(c.price)+' ₴</div><button class="btn green" onclick="sellFromCollection('+i+')">'+t('sell')+'</button></div>').join('');
}
function setLeaderTab(tab){ leaderTab=tab;
  document.getElementById('tabMoney').classList.toggle('on',tab==='money');
  document.getElementById('tabSpins').classList.toggle('on',tab==='spins');
  renderLeaders(); }
function renderLeaders(){
  document.getElementById('lbTitle').textContent=t('lbTitle');
  document.getElementById('tabMoney').textContent=t('byMoney');
  document.getElementById('tabSpins').textContent=t('bySpins');
  const {top,rank,inTop,key}=leaderRows(leaderTab);
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
  const row=(e,i,realRank)=> '<div class="lb-row'+(e.me?' me':'')+(key==='spins'?' spins':'')+'">'+
    '<div class="num">'+(realRank!=null?realRank:(i<3?'<span class="medal">'+medal(i)+'</span>':i+1))+'</div>'+
    '<div class="nm">'+e.name+'</div><div class="val">'+fmt(e[key])+(key==='money'?' ₴':'')+'</div></div>';
  let html=top.map((e,i)=>row(e,i)).join('');
  if(!inTop){ const me={name:nick||t('you'),money:balance,spins:totalSpins,me:true}; html+='<div class="lb-sep"></div>'+row(me,null,rank); }
  document.getElementById('lbList').innerHTML=html;
}
function renderShop(){
  document.getElementById('shopTitle').textContent=t('shopTitle');
  const tc=document.getElementById('shTabCur'), ta=document.getElementById('shTabAsset');
  tc.textContent=t('shop.currency'); ta.textContent=t('shop.assets');
  tc.classList.toggle('on',shopTab==='currency'); ta.classList.toggle('on',shopTab==='assets');
  document.getElementById('shopCurrency').hidden=shopTab!=='currency';
  document.getElementById('shopAssets').hidden=shopTab!=='assets';
  if(shopTab==='assets'){ document.getElementById('shopAssets').innerHTML=renderAssets(); return; }
  document.getElementById('freeTitle').textContent=t('freeTitle');
  document.getElementById('freeDesc').textContent=t('freeDesc');
  document.getElementById('watchAdBtn').textContent=t('watchAd');
  document.getElementById('buyTitle').textContent=t('buyTitle');
  document.getElementById('demoNote').textContent=t('demoNote');
  const packs=[{c:10000,p:'$0.99',ic:'💰'},{c:60000,p:'$3.99',ic:'💰💰',tag:'popular'},{c:200000,p:'$9.99',ic:'💰💰💰',tag:'best'}];
  document.getElementById('packList').innerHTML=packs.map(pk=>
    '<div class="row pack"><div class="ic">'+pk.ic+'</div><div class="info"><div class="amt">'+fmt(pk.c)+' ₴</div>'+
    (pk.tag?'<span class="tag'+(pk.tag==='best'?' best':'')+'">'+t(pk.tag)+'</span>':'')+'</div>'+

/* ======================= Модалки / тост ======================= */
let pendingOk=null;
function showConfirm(msg,onOk){ pendingOk=onOk; const m=document.getElementById('modal');
  m.innerHTML='<div class="modal-card"><p style="margin-top:4px">'+msg+'</p><div class="modal-actions">'+
   '<button class="btn ghost" onclick="closeModal()">'+t('cancel')+'</button>'+
   '<button class="btn gold" onclick="confirmModal()">'+t('ok')+'</button></div></div>'; m.hidden=false; }
function confirmModal(){ const f=pendingOk; closeModal(); f&&f(); }
function closeModal(){ const m=document.getElementById('modal'); m.hidden=true; m.innerHTML=''; pendingOk=null; }
let toastT=null;
function showToast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2200); }

/* ======================= Налаштування ======================= */
function toggleMute(){ muted=!muted; save('muted',muted); updateTopbar(); if(!muted) ensureAudio(); }
function cycleLang(){ LANG=LANGS[(LANGS.indexOf(LANG)+1)%LANGS.length]; save('lang',LANG); applyAll(); }
function applyAll(){ document.documentElement.lang=LANG; updateTopbar(); renderNav(); renderScreen(activeScreen); }

/* ======================= Утиліти/старт ======================= */
function save(k,v){ try{localStorage.setItem('ns_'+k,JSON.stringify(v));}catch(e){} }
function load(k,def){ try{const r=localStorage.getItem('ns_'+k); return r===null?def:JSON.parse(r);}catch(e){return def;} }
updateTopbar(); renderNav(); switchScreen('game');
</script>
